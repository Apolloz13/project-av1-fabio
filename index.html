<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sidebar/Menu lateral -->
    <aside class="sidebar">
        <nav class="sidebar-navigation">
            <div class="logo">
                <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_RGB_White.png" alt="Spotify Logo">
            </div>
            <ul>
                <li><a href="#" class="active"><i class="fas fa-home"></i>Início</a></li>
                <li><a href="#"><i class="fas fa-search"></i>Buscar</a></li>
                <li><a href="#"><i class="fas fa-book"></i>Sua Biblioteca</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">
        <header class="top-bar">
            <div class="navigation-buttons">
                <button class="nav-btn"><i class="fas fa-chevron-left"></i></button>
                <button class="nav-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="user-menu">
                <button class="upgrade-btn">Fazer upgrade</button>
                <button class="profile-btn">Perfil</button>
            </div>
        </header>

        <section class="content">
            <h1>Boa noite</h1>
            <div class="playlists-grid">
                <!-- Playlist cards irão aqui -->
                <div class="playlist-card">
                    <img src="https://placeholder.com/300" alt="Playlist Cover">
                    <h3>Músicas Curtidas</h3>
                    <p>Lista de reprodução • 123 músicas</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Player bar -->
    <footer class="player-bar">
        <div class="now-playing">
            <img src="https://placeholder.com/56" alt="Current Track">
            <div class="track-info">
                <h4>Nome da música</h4>
                <p>Artista</p>
            </div>
        </div>
        <div class="player-controls">
            <div class="control-buttons">
                <button><i class="fas fa-random"></i></button>
                <button><i class="fas fa-step-backward"></i></button>
                <button class="play-btn"><i class="fas fa-play"></i></button>
                <button><i class="fas fa-step-forward"></i></button>
                <button><i class="fas fa-redo"></i></button>
            </div>
            <div class="progress-bar">
                <span class="current-time">0:00</span>
                <div class="progress">
                    <div class="progress-filled"></div>
                </div>
                <span class="total-time">3:45</span>
            </div>
        </div>
        <div class="volume-controls">
            <button><i class="fas fa-volume-up"></i></button>
            <div class="volume-bar">
                <div class="volume-filled"></div>
            </div>
        </div>
    </footer>
</body>
</html>
