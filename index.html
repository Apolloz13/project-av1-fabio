<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="player-section">
            <!-- A tag <section> representa uma seção temática do conteúdo, neste caso a área do player de música.
                 É mais semântica que uma <div> genérica, ajudando na acessibilidade e SEO da página -->
            <div class="musica-card">
                <img src="https://placeholder.co/64" alt="Capa do álbum" width="64" height="64">
                <div class="musica-info">
                    <h3>Nome da Música</h3>
                    <p>Nome do Artista</p>
                    <button class="play-button">Tocar</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>

<!-- A tag <main> é usada para indicar o conteúdo principal da página, melhorando a acessibilidade e SEO do site -->
<!-- O CSS é carregado no <head> para evitar FOUC (Flash of Unstyled Content) enquanto o JavaScript é carregado com 'defer' para não bloquear o parsing do HTML -->
