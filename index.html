<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; frame-src 'self' https://www.youtube.com; frame-ancestors 'self';">
    <meta http-equiv="Permissions-Policy" content="accelerometer=(), autoplay=(), camera=(), clipboard-write=(), encrypted-media=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()"
    <title>Appolo Music</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    <script>
        // Carrega a API do YouTube
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" width="32" height="32">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 7v7l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h1>Appolo Music</h1>
            </div>
            <div class="search-container">
                <input type="search" id="search-input" placeholder="Buscar música ou artista...">
                <button class="search-button">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <aside class="sidebar">
        <nav class="playlist-nav">
            <h2>Minhas Playlists</h2>
            <div class="playlist-list">
                <!-- Playlists serão inseridas aqui -->
            </div>
            <button id="nova-playlist" class="new-playlist-btn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
                </svg>
                Nova Playlist
            </button>
        </nav>
    </aside>

    <main class="container">
        <div id="player-hidden" style="display: none;"></div>
        <div class="content-area">
            <!-- Resultados da busca e playlists serão mostrados aqui -->
        </div>
    </main>

    <footer class="player-footer">
        <div class="player-content">
            <div class="player-info">
                <img src="https://picsum.photos/56" alt="Capa do álbum" class="player-cover">
                <div class="player-text">
                    <h3 class="player-title">Selecione uma música</h3>
                    <p class="player-artist">---</p>
                </div>
            </div>
            <audio id="audio-player" hidden></audio>
            <div id="youtube-player"></div>
            
            <div class="player-controls">
                <button class="control-button" id="prevButton">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="control-button play-pause" id="playButton">
                    <svg viewBox="0 0 24 24" width="32" height="32">
                        <path d="M8 5v14l11-7z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="control-button" id="nextButton">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M6 6l8.5 6-8.5 6V6zm9.5 0h2v12h-2z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="progress-bar">
            <div class="progress-filled"></div>
        </div>
    </footer>
</body>
</html>

<!-- Utilizamos a fonte Inter do Google Fonts por sua excelente legibilidade em displays modernos -->
<!-- A estrutura header/main/footer segue as melhores práticas de HTML semântico, melhorando SEO e acessibilidade -->
